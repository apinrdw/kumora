  const D=withDelta(S.code,S.date,S.grouped),m=D.m,o=origins(m),top=D.rows[0];
  const head=`<div class="crumbs">Market / Ownership / ${S.code}</div>
  <div class="row spread"><h1>${S.code} <span class="muted" style="font-weight:500">${m.r.name}</span></h1><div class="row">${stockSel()}${monthSel("date",S.date)}</div></div>
  <div class="card"><div class="stats">
    <div class="stat"><b>${fmt(m.total)}</b><span>Scripless shares, as of ${S.date}</span></div>
    <div class="stat"><b>${o.l===null?"—":pct(o.l/m.total)}</b><span>${o.l===null?"Local: "+NA:"Held by local investors"}</span></div>
    <div class="stat"><b>${o.f===null?"—":pct(o.f/m.total)}</b><span>${o.f===null?"Foreign: "+NA:"Held by foreign investors"}</span></div>
    <div class="stat"><b>${top.label}</b><span>Largest holder, ${pct(top.share)}</span></div>
  </div></div>`;
  const rowsHtml=D.rows.map(x=>{
    const main=`<tr class="${S.grouped?"":""}"><td><span class="sw" style="background:${x.color}"></span>${x.label}</td><td class="num">${fmt(x.combined)}</td><td class="num">${pct(x.share)}</td><td><div class="pctbar"><i style="width:${Math.min(100,x.share*100)}%;background:${x.color}"></i></div></td>${dcell(x.dShares,fmt)}${dcell(x.dShare,v=>(v*100).toFixed(2)+"%")}<td class="num">${x.local===null?'<span class="na">—</span>':fmt(x.local)}</td><td class="num">${x.foreign===null?'<span class="na">—</span>':fmt(x.foreign)}</td>${dcell(x.dForeign,fmt)}<td>${lfbar(x)}</td></tr>`;
    return main;
  }).join("");
  const prevNote=!D.p?"No earlier month in the archive, so no change is shown.":D.bothSplit?`Change is from ${mlabel(D.pd)}.`:`Change is from ${mlabel(D.pd)}. ${D.m.split?mlabel(D.pd)+" has no local/foreign split":"This month has no local/foreign split"}, so only totals per class change; local and foreign changes read —.`;
  return head+`<div class="card"><div class="row spread"><h2>Holdings by investor classification</h2>
    <div class="seg" id="grp"><button type="button" data-g="1" aria-pressed="${S.grouped}">9 KSEI types</button><button type="button" data-g="0" aria-pressed="${!S.grouped}">All 39 classes</button></div></div>
    <div class="tbl"><table><thead><tr><th>Class</th><th class="num">Shares</th><th class="num">% of scripless</th><th></th><th class="num">Δ shares</th><th class="num">Δ share</th><th class="num">Local</th><th class="num">Foreign</th><th class="num">Δ foreign</th><th>Local / foreign</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
    <div class="note">${prevNote} Classes with no shares are left out. Legend for the bar: <span class="sw" style="background:var(--g3)"></span>local <span class="sw" style="background:var(--g1)"></span>foreign.</div></div>`;
}

function vTimeline(){
  const months=[...DATES].reverse();
  const last=month(S.code,DATES[DATES.length-1]);
  const bars=months.map(d=>{const m=month(S.code,d),g=agg(m,true);
    return `<div class="trow" role="button" tabindex="0" data-d="${d}" aria-pressed="${d===S.tdate}"><span class="mono">${mlabel(d)}</span><div class="stack">${g.map(x=>`<i title="${x.label} ${pct(x.combined/m.total)}" style="width:${x.combined/m.total*100}%;background:${x.color}"></i>`).join("")}</div><span class="mono muted" style="text-align:right">${m.split?"split":"combined"}</span></div>`}).join("");
  const legend=GROUPS.map(g=>`<span><span class="sw" style="background:var(${g[2]})"></span>${g[1]}</span>`).join("");
  const D=withDelta(S.code,S.tdate,true);
  const detail=D.rows.map(x=>`<tr><td><span class="sw" style="background:${x.color}"></span>${x.label}</td><td class="num">${pct(x.share)}</td>${dcell(x.dShare,v=>(v*100).toFixed(2)+"%")}${dcell(x.dShares,fmt)}<td>${lfbar(x)}</td><td class="muted" style="white-space:normal;font-size:12px">${(x.members||[]).sort((a,b)=>b.combined-a.combined).slice(0,3).map(y=>nice(y.k)+" "+pct(y.combined/D.m.total)).join(", ")}</td></tr>`).join("");
  return `<div class="crumbs">Market / Ownership / ${S.code}</div>
  <div class="row spread"><h1>${S.code} <span class="muted" style="font-weight:500">${last.r.name}</span></h1>${stockSel()}</div>
  <div class="card"><div class="row spread"><h2>Ownership mix by month</h2><span class="note">Each bar is 100% of scripless shares. Click a month.</span></div>
   <div style="display:flex;flex-direction:column;gap:2px">${bars}</div><div class="legend">${legend}</div></div>
  <div class="card"><h2>${mlabel(S.tdate)} <span class="muted" style="font-weight:500">vs ${D.pd?mlabel(D.pd):"no earlier month"}</span></h2>
   <div class="tbl"><table><thead><tr><th>Group</th><th class="num">Share</th><th class="num">Δ share</th><th class="num">Δ shares</th><th>Local / foreign</th><th>Largest classes in group</th></tr></thead><tbody>${detail}</tbody></table></div>
   ${D.p&&!D.bothSplit?`<div class="note">${D.m.split?mlabel(D.pd):mlabel(S.tdate)} has no local/foreign split, so only totals are compared.</div>`:""}</div>`;
}

function vCombo(){
  const t=vTable(),cut=t.indexOf('<div class="card"><div class="row spread"><h2>Holdings');
  const months=[...DATES].reverse();
  const bars=months.map(d=>{const m=month(S.code,d),g=agg(m,true);
    return `<div class="trow" role="button" tabindex="0" data-d="${d}" data-pick="date" aria-pressed="${d===S.date}"><span class="mono">${mlabel(d)}</span><div class="stack">${g.map(x=>`<i title="${x.label} ${pct(x.combined/m.total)}" style="width:${x.combined/m.total*100}%;background:${x.color}"></i>`).join("")}</div><span class="mono muted" style="text-align:right">${m.split?"split":"combined"}</span></div>`}).join("");
  const legend=GROUPS.map(g=>`<span><span class="sw" style="background:var(${g[2]})"></span>${g[1]}</span>`).join("");
  const tl=`<div class="card"><div class="row spread"><h2>Ownership mix by month</h2><span class="note">Each bar is 100% of scripless shares, by KSEI type. Click a month to show it below.</span></div>
   <div style="display:flex;flex-direction:column;gap:2px">${bars}</div><div class="legend">${legend}</div></div>`;
  return t.slice(0,cut)+tl+t.slice(cut);
}

function vPanel(){
  const D=withDelta(S.code,S.date,false),m=D.m,o=origins(m);
  const top=D.rows.slice(0,6);
  const movers=D.p?[...D.rows].filter(x=>x.dShares).sort((a,b)=>Math.abs(b.dShares)-Math.abs(a.dShares)).slice(0,4):[];
  return `<div class="crumbs">Market / Market Live / ${S.code}</div>
  <div class="row spread"><h1>Market Live</h1><div class="row">${stockSel()}</div></div>
  <div class="split"><div class="fake">Existing Market Live chart, tape and order book</div>
  <div class="card" style="gap:10px"><div class="row spread"><h2>Who holds ${S.code}</h2>${monthSel("date",S.date)}</div>
    ${o.l===null?`<div class="note">Local / foreign: ${NA}.</div>`:`<div><div class="lf" style="width:100%;height:10px"><i style="width:${o.l/m.total*100}%;background:var(--g3)"></i><i style="width:${o.f/m.total*100}%;background:var(--g1)"></i></div><div class="row spread note" style="margin-top:4px"><span>Local ${pct(o.l/m.total)}</span><span>Foreign ${pct(o.f/m.total)}</span></div></div>`}
    <div>${top.map(x=>`<div class="mover"><span>${x.label}</span><b class="num">${pct(x.share)}</b><div class="pctbar" style="width:100%"><i style="width:${Math.min(100,x.share*100)}%"></i></div><span class="num note ${x.dShare>0?"up":x.dShare<0?"down":""}">${x.dShare===null?"":pp(x.dShare)}</span></div>`).join("")}</div>
    <h2 style="margin-top:4px">Biggest changes ${D.pd?"since "+mlabel(D.pd):""}</h2>
    <div>${movers.length?movers.map(x=>`<div class="mover"><span>${x.label}</span><b class="num ${x.dShares>0?"up":"down"}">${sgn(x.dShares,fmt)}</b><span class="note">${D.bothSplit&&x.dForeign!==null?"foreign "+sgn(x.dForeign,fmt):"local / foreign change unavailable"}</span><span></span></div>`).join(""):`<div class="note">No earlier month in the archive.</div>`}</div>
    <a href="#table" class="note" style="color:var(--accent)">Full breakdown →</a>
  </div></div>`;
}

function render(){
  const body=S.variant==="combo"?vCombo():S.variant==="table"?vTable():S.variant==="timeline"?vTimeline():vPanel();
  document.getElementById("app").innerHTML=`<div class="proto">Prototype for "What a stock's ownership mix by investor classification looks like in the dashboard". Real numbers from the 8 archived IDX classification reports (Mar–Oct 2026), 8 stocks. The 39 classes are grouped into KSEI's 9 investor types by the owner's mapping; against IDX's own "by investor type" report, ID, PF and FD match within 1% of shares for every stock, while CP and OT do for about 70% of stocks.</div>`+body;
  const q=id=>document.getElementById(id);
  if(q("code")) q("code").onchange=e=>{S.code=e.target.value;render()};
  if(q("date")) q("date").onchange=e=>{S.date=e.target.value;render()};
  if(q("grp")) q("grp").onclick=e=>{const g=e.target.dataset&&e.target.dataset.g;if(g){S.grouped=g==="1";render()}};
  document.querySelectorAll(".trow").forEach(t=>{const f=()=>{if(t.dataset.pick==="date")S.date=t.dataset.d;else S.tdate=t.dataset.d;render()};t.onclick=f;t.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  document.querySelectorAll("#variants button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===S.variant));
}
const keys=Object.keys(VARIANTS);
function setVariant(k){S.variant=k;try{history.replaceState(null,"","#"+k)}catch(e){location.hash=k}render()}
document.getElementById("variants").innerHTML=keys.map(k=>`<button type="button" data-k="${k}">${VARIANTS[k]}</button>`).join("");
document.getElementById("variants").onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)setVariant(k)};
const step=d=>setVariant(keys[(keys.indexOf(S.variant)+d+keys.length)%keys.length]);
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
window.addEventListener("keydown",e=>{const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable))return;if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VARIANTS[h]&&h!==S.variant){S.variant=h;render()}});
render();
</script>
