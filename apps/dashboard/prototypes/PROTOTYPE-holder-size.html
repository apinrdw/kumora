/* Layout: one stock-page column; controls row, then the variant's panel; a floating variant bar at the bottom. */
:root {
  --bg: #f6f7f8; --panel: #ffffff; --fg: #15191e; --muted: #5d6670; --line: #dde1e5;
  --block: #1f5f8b; --spread: #9cc3dd; --scrip: #c9ced3; --up: #1d7a46; --down: #b3372f; --accent: #1f5f8b;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1215; --panel: #171b20; --fg: #e6e9ec; --muted: #98a2ac; --line: #2a3038;
  --block: #5aa6d6; --spread: #2c5772; --scrip: #3a4149; --up: #4fbf7d; --down: #e26a60; --accent: #5aa6d6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1215; --panel: #171b20; --fg: #e6e9ec; --muted: #98a2ac; --line: #2a3038;
  --block: #5aa6d6; --spread: #2c5772; --scrip: #3a4149; --up: #4fbf7d; --down: #e26a60; --accent: #5aa6d6; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 20px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.proto { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); padding: 8px 10px; border-radius: 6px; }
h1 { font-size: 20px; margin: 0; font-weight: 600; text-wrap: balance; }
h1 small { font-family: var(--mono); font-weight: 500; color: var(--muted); font-size: 14px; margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 5px 10px; background: var(--panel); color: var(--fg); border: 0; border-right: 1px solid var(--line); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button:disabled { color: var(--muted); cursor: not-allowed; opacity: .5; }
.seg button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 6px; }
select { font: inherit; font-size: 13px; padding: 4px 6px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font-size: 15px; margin: 0; font-weight: 600; }
.sub { color: var(--muted); font-size: 12.5px; margin: 0; max-width: 70ch; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--bg); }
.bar > span { display: block; height: 100%; }
.b5 { background: var(--block); } .bs { background: var(--spread); } .bscrip { background: var(--scrip); }
.big .bar { height: 28px; }
.bigrow { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; }
.bigrow b { font-family: var(--mono); font-weight: 500; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(120px, 170px) 1fr 150px; gap: 10px; align-items: center; }
.row .name { font-size: 13px; }
.row .vals { font-size: 12px; text-align: right; }
.delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta { color: var(--muted); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.num { font-family: var(--mono); }
tr.zero td { color: var(--muted); }
svg text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.note { font-size: 12px; color: var(--muted); }
.vbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); border-radius: 999px; padding: 6px; display: flex; gap: 4px; box-shadow: 0 4px 18px rgba(0,0,0,.25); max-width: calc(100% - 32px); overflow-x: auto; }
.vbar button { font: inherit; font-size: 13px; border: 0; border-radius: 999px; padding: 6px 12px; background: transparent; color: inherit; cursor: pointer; white-space: nowrap; }
.vbar button[aria-pressed="true"] { background: var(--bg); color: var(--fg); }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; gap: 4px; } .row .vals { text-align: left; } }
</style>

306873, 0], "ID": [585846910, 0], "IS": [32883891, 0], "MF": [4488567535, 0], "OT": [71440629, 0], "PF": [8855700, 0], "SC": [2410344281, 0]}}, "scripless": 51752073334}}};
const TYPES = { CP: "Corporate", FD: "Foundation", IB: "Financial institution", ID: "Individual", IS: "Insurance", MF: "Mutual fund", OT: "Others", PF: "Pension fund", SC: "Securities company" };
const VARIANTS = [["a", "A · Rows in composition"], ["b", "B · Holder size panel"], ["c", "C · Months chart"]];
const S = { stock: "AADI", month: "2026-10-30", origin: "combined", denom: "scripless", variant: "a" };
try { Object.assign(S, JSON.parse(localStorage.getItem("hs-proto") || "{}")); } catch {}
if (location.hash.slice(1) && VARIANTS.some(v => v[0] === location.hash.slice(1))) S.variant = location.hash.slice(1);

const $ = id => document.getElementById(id);
const months = s => Object.keys(DATA[s]).sort();
const fmtMonth = d => new Date(d + "T00:00:00Z").toLocaleDateString("en-GB", { month: "short", year: "numeric", timeZone: "UTC" });
const pct = x => (x * 100).toFixed(x < 0.001 && x > 0 ? 2 : 1) + "%";
const bn = x => (x / 1e9).toFixed(x >= 1e10 ? 1 : 2) + " bn";
const pts = d => d === null ? "<span class=delta>first month</span>" : `<span class="delta ${d > 0.0005 ? "up" : d < -0.0005 ? "down" : ""}">${d > 0 ? "+" : ""}${(d * 100).toFixed(1)} pts</span>`;
const split = rec => "local" in rec.origins;

// One month's numbers for the chosen origin and denominator.
function shape(rec, origin, denom) {
  const o = rec.origins[origin];
  if (!o) return null;
  const sumOrigin = Object.values(o).reduce((a, [u, g]) => a + u + g, 0);
  const useOut = denom === "outstanding" && origin === "combined";
  const base = useOut ? rec.outstanding : sumOrigin;
  const types = Object.keys(TYPES).map(t => ({ t, under: o[t][0], at: o[t][1] }));
  const at = types.reduce((a, x) => a + x.at, 0), under = types.reduce((a, x) => a + x.under, 0);
  return { base, useOut, scrip: useOut ? rec.outstanding - rec.scripless : 0, at, under, types };
}
function prevRec(s, m) { const ms = months(s); const i = ms.indexOf(m); return i > 0 ? DATA[s][ms[i - 1]] : null; }

function controls() {
  $("stock").innerHTML = Object.keys(DATA).map(s => `<option ${s === S.stock ? "selected" : ""}>${s}</option>`).join("");
  const ms = months(S.stock); if (!ms.includes(S.month)) S.month = ms.at(-1);
  $("month").innerHTML = ms.slice().reverse().map(m => `<option value="${m}" ${m === S.month ? "selected" : ""}>${fmtMonth(m)}</option>`).join("");
  const rec = DATA[S.stock][S.month];
  if (!split(rec) && S.origin !== "combined" && S.variant !== "c") S.origin = "combined";
  $("origin").innerHTML = [["combined", "All"], ["local", "Local"], ["foreign", "Foreign"]].map(([k, l]) =>
    `<button aria-pressed="${S.origin === k}" data-k="${k}" ${!split(rec) && k !== "combined" && S.variant !== "c" ? 'disabled title="Not reported before Jan 2026"' : ""}>${l}</button>`).join("");
  $("denom").innerHTML = [["scripless", "Scripless"], ["outstanding", "Shares outstanding"]].map(([k, l]) =>
    `<button aria-pressed="${S.denom === k}" data-k="${k}" ${k === "outstanding" && S.origin !== "combined" ? 'disabled title="Scrip isn\'t split by origin"' : ""}>${l}</button>`).join("");
  $("vbar").innerHTML = VARIANTS.map(([k, l]) => `<button aria-pressed="${S.variant === k}" data-k="${k}">${l}</button>`).join("");
  $("title").innerHTML = `${S.stock}<small>holder size · IDX investor-type report</small>`;
}

const legend = sh => `<div class="legend"><span><i class="sw b5"></i>≥5% holders</span><span><i class="sw bs"></i>&lt;5% holders</span>${sh && sh.useOut ? '<span><i class="sw bscrip"></i>Scrip (paper, not in the report)</span>' : ""}</div>`;
const caveat = `<p class="note">IDX counts a holder as ≥5% when one investor holds at least 5% of shares outstanding in scripless form. A big holder spread across types can show part of its stake as &lt;5%, so the split by type is approximate.</p>`;

function viewA() {
  const rec = DATA[S.stock][S.month], sh = shape(rec, S.origin, S.denom);
  const pr = prevRec(S.stock, S.month), psh = pr && shape(pr, S.origin, S.denom);
  const rows = sh.types.filter(x => x.at + x.under > 0).sort((a, b) => (b.at + b.under) - (a.at + a.under)).map(x => {
    const p = psh && psh.types.find(y => y.t === x.t);
    const share = (x.at + x.under) / sh.base;
    return `<div class="row"><div class="name">${TYPES[x.t]} <span class="num" style="color:var(--muted)">${x.t}</span></div>
      <div class="bar" title="${TYPES[x.t]}: ${pct(x.at / sh.base)} ≥5%, ${pct(x.under / sh.base)} <5%"><span class="b5" style="width:${x.at / sh.base * 100}%"></span><span class="bs" style="width:${x.under / sh.base * 100}%"></span></div>
      <div class="vals num">${pct(share)} · ≥5% ${pct(x.at / sh.base)}<br>${pts(p ? (x.at / sh.base) - (p.at / psh.base) : null)} ≥5%</div></div>`;
  }).join("");
  return `<section class="panel"><h2>Shareholders composition · ${fmtMonth(S.month)}</h2>
    <p class="sub">Each investor type's row from the existing panel, split into what ≥5% holders and &lt;5% holders own. The change is the ≥5% share against ${pr ? fmtMonth(months(S.stock)[months(S.stock).indexOf(S.month) - 1]) : "the month before"}.</p>
    ${legend(sh)}<div class="rows">${rows}</div>
    ${sh.useOut ? `<div class="row"><div class="name">Scrip</div><div class="bar"><span class="bscrip" style="width:${sh.scrip / sh.base * 100}%"></span></div><div class="vals num">${pct(sh.scrip / sh.base)}</div></div>` : ""}
    ${caveat}</section>`;
}

function viewB() {
  const rec = DATA[S.stock][S.month], sh = shape(rec, S.origin, S.denom);
  const pr = prevRec(S.stock, S.month), psh = pr && shape(pr, S.origin, S.denom);
  const d = (cur, prev) => pts(psh ? cur - prev : null);
  const head = `<div class="big"><div class="bar">${sh.useOut ? `<span class="bscrip" style="width:${sh.scrip / sh.base * 100}%"></span>` : ""}<span class="b5" style="width:${sh.at / sh.base * 100}%"></span><span class="bs" style="width:${sh.under / sh.base * 100}%"></span></div></div>
    <div class="bigrow">${sh.useOut ? `<span>Scrip <b>${pct(sh.scrip / sh.base)}</b></span>` : ""}<span>≥5% holders <b>${pct(sh.at / sh.base)}</b> ${d(sh.at / sh.base, psh && psh.at / psh.base)}</span><span>&lt;5% holders <b>${pct(sh.under / sh.base)}</b> ${d(sh.under / sh.base, psh && psh.under / psh.base)}</span><span>Shares <b>${bn(sh.base)}</b></span></div>`;
  const body = sh.types.sort((a, b) => b.at - a.at || (b.under - a.under)).map(x => {
    const p = psh && psh.types.find(y => y.t === x.t), tot = x.at + x.under;
    return `<tr class="${tot ? "" : "zero"}"><td>${TYPES[x.t]}</td><td class="num">${pct(x.at / sh.base)}</td><td class="num">${pts(p ? x.at / sh.base - p.at / psh.base : null)}</td><td class="num">${pct(x.under / sh.base)}</td><td class="num">${pts(p ? x.under / sh.base - p.under / psh.base : null)}</td><td class="num">${tot ? pct(x.at / tot) : "–"}</td></tr>`;
  }).join("");
  return `<section class="panel"><h2>Holder size · ${fmtMonth(S.month)}</h2>
    <p class="sub">A panel of its own, between Shareholders composition and Holding composition. The bar is the whole stock; the table splits each type.</p>
    ${legend(sh)}${head}
    <div class="tablewrap"><table><thead><tr><th>Investor type</th><th>≥5%</th><th>change</th><th>&lt;5%</th><th>change</th><th>of the type in ≥5%</th></tr></thead><tbody>${body}</tbody></table></div>
    ${caveat}</section>`;
}

function viewC() {
  const ms = months(S.stock), W = 860, H = 240, L = 40, B = 34, colW = (W - L - 10) / ms.length;
  let cols = "", grid = "";
  for (let g = 0; g <= 4; g++) { const y = 10 + (H - B - 10) * (1 - g / 4); grid += `<line x1="${L}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 6}" y="${y + 3}" text-anchor="end">${g * 25}%</text>`; }
  ms.forEach((m, i) => {
    const x = L + i * colW + colW * 0.15, w = colW * 0.7, rec = DATA[S.stock][m], sh = shape(rec, S.origin, S.denom);
    const ph = H - B - 10;
    if (!sh) { cols += `<rect x="${x}" y="${10}" width="${w}" height="${ph}" fill="none" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${x + w / 2}" y="${10 + ph / 2}" text-anchor="middle">n/a</text>`; }
    else {
      let y = 10;
      const seg = (v, c) => { const h = v / sh.base * ph; cols += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h, 0)}" fill="var(${c})"><title>${fmtMonth(m)}: ${pct(v / sh.base)}</title></rect>`; y += h; };
      if (sh.useOut) seg(sh.scrip, "--scrip");
      seg(sh.under, "--spread"); seg(sh.at, "--block");
    }
    cols += `<text x="${x + w / 2}" y="${H - B + 14}" text-anchor="middle" ${m === S.month ? 'style="fill:var(--fg);font-weight:600"' : ""}>${fmtMonth(m).replace(" 20", " '")}</text>`;
  });
  const rec = DATA[S.stock][S.month], sh = shape(rec, S.origin, S.denom) || shape(rec, "combined", S.denom);
  const tbl = sh.types.filter(x => x.at > 0).map(x => `<tr><td>${TYPES[x.t]}</td>${ms.map(m => { const s2 = shape(DATA[S.stock][m], S.origin, S.denom); const y = s2 && s2.types.find(z => z.t === x.t); return `<td class="num">${s2 ? pct(y.at / s2.base) : "–"}</td>`; }).join("")}</tr>`).join("");
  return `<section class="panel"><h2>Holder size by month</h2>
    <p class="sub">One column per month, ≥5% holders at the bottom. ${S.origin !== "combined" ? "Nov–Dec 2025 don't split local from foreign, so they're marked n/a." : ""} The table lists each type that has ≥5% holders.</p>
    ${legend(sh)}<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px" role="img" aria-label="≥5% and <5% holders by month">${grid}${cols}</svg></div>
    <div class="tablewrap"><table><thead><tr><th>≥5% held by</th>${ms.map(m => `<th>${fmtMonth(m).replace(" 20", " '")}</th>`).join("")}</tr></thead><tbody>${tbl || `<tr><td colspan="${ms.length + 1}">No ≥5% holders in any month.</td></tr>`}</tbody></table></div>
    ${caveat}</section>`;
}

function render() {
  controls();
  $("view").innerHTML = { a: viewA, b: viewB, c: viewC }[S.variant]();
  try { localStorage.setItem("hs-proto", JSON.stringify(S)); } catch {}
}
$("stock").onchange = e => { S.stock = e.target.value; render(); };
$("month").onchange = e => { S.month = e.target.value; render(); };
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"); if (!b || b.disabled) return;
  const box = b.parentElement.id;
  if (box === "origin") { S.origin = b.dataset.k; if (S.origin !== "combined") S.denom = "scripless"; }
  if (box === "denom") S.denom = b.dataset.k;
  if (box === "vbar") { S.variant = b.dataset.k; history.replaceState(null, "", "#" + S.variant); }
  render();
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VARIANTS.some(v => v[0] === h)) { S.variant = h; render(); } });
render();
</script>
