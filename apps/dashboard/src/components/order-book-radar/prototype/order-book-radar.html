<title>Order Book Radar Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: the dashboard's dark terminal shell; one shared toolbar, three scanner bodies swapped by #table / #tug / #tiles, a floating variant bar. */
:root {
  --bg-canvas: #0b1421; --bg-sidebar: #0e1a29; --bg-surface: #142234; --bg-elevated: #1b2c40; --bg-selected: #173a43;
  --border-subtle: #26394e; --border-strong: #3e566b;
  --text-primary: #edf4fb; --text-secondary: #b0c2d2; --text-muted: #839aae;
  --accent: #55d9c7; --accent-on: #09242a;
  --up: #51dda2; --down: #ff7987; --warn: #f4c36e; --info: #7dbcf5; --neutral: #a8b8c8;
  --up-soft: color-mix(in oklab, var(--up) 18%, transparent);
  --down-soft: color-mix(in oklab, var(--down) 18%, transparent);
  --proto: #b3a0ff;
  --font-sans: "Manrope", Arial, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg-canvas); color: var(--text-primary); font: 13px/1.4 var(--font-sans); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--text-muted); }

.app { display: flex; flex-direction: column; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 96px; gap: 10px; }
.proto-strip { display: flex; gap: 8px; align-items: center; color: var(--proto); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.proto-strip b { font-weight: 700; }
header.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
header.top h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; background: var(--bg-elevated); color: var(--text-secondary); font-size: 12px; border: 1px solid var(--border-subtle); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
.chip.stale .dot { background: var(--warn); }
.spacer { flex: 1; }
.iconbtn { position: relative; background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 5px 10px; color: var(--text-secondary); }
.iconbtn:hover { border-color: var(--border-strong); color: var(--text-primary); }
.badge { position: absolute; top: -6px; right: -6px; background: var(--accent); color: var(--accent-on); border-radius: 999px; font-size: 10px; padding: 0 5px; font-weight: 700; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 8px 10px; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; color: var(--text-muted); font-size: 12px; }
.toolbar select, .toolbar input[type=text], .toolbar input[type=number] { background: var(--bg-canvas); border: 1px solid var(--border-strong); border-radius: 5px; padding: 4px 6px; color: var(--text-primary); }
.toolbar input[type=number] { width: 78px; }
.toolbar input[type=text] { width: 110px; text-transform: uppercase; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 5px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 4px 8px; color: var(--text-secondary); }
.seg button[aria-pressed=true] { background: var(--bg-selected); color: var(--text-primary); }
.sortnote { font-size: 12px; color: var(--text-muted); }
.sortnote b { color: var(--text-secondary); font-weight: 600; }

.banner { display: none; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 6px; background: color-mix(in oklab, var(--warn) 14%, var(--bg-surface)); border: 1px solid color-mix(in oklab, var(--warn) 45%, transparent); color: var(--text-primary); font-size: 12px; }
.banner.on { display: flex; }
.excluded { font-size: 12px; color: var(--text-muted); }

/* Variant A: dense table */
.tablewrap { overflow-x: auto; border: 1px solid var(--border-subtle); border-radius: 6px; background: var(--bg-surface); }
table.scan { width: 100%; border-collapse: collapse; min-width: 980px; }
table.scan th, table.scan td { padding: 5px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border-subtle); }
table.scan th { position: sticky; top: 0; background: var(--bg-elevated); color: var(--text-muted); font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; user-select: none; }
table.scan th.sorted { color: var(--accent); }
table.scan th:first-child, table.scan td:first-child { text-align: left; }
table.scan tbody tr { cursor: pointer; transition: background .15s; }
table.scan tbody tr:hover { background: var(--bg-selected); }
tr.stale td { color: var(--text-muted); opacity: .55; }
tr.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in oklab, var(--accent) 22%, transparent); } to { background: transparent; } }
.code { font-weight: 700; letter-spacing: .02em; }
.codecell { display: flex; gap: 6px; align-items: center; }
.tag { font-size: 10px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--border-strong); color: var(--text-secondary); font-weight: 600; }
.tag.limit { border-color: var(--warn); color: var(--warn); }
.tag.star { border: 0; color: var(--accent); padding: 0; }
.imb { display: inline-grid; grid-template-columns: 52px 50px; align-items: center; gap: 6px; }
.imbbar { position: relative; height: 8px; background: var(--bg-canvas); border-radius: 2px; }
.imbbar::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--border-strong); }
.imbbar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.ev { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; }
.evk { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; letter-spacing: .03em; }
.evk.bid { background: var(--up-soft); color: var(--up); }
.evk.offer { background: var(--down-soft); color: var(--down); }
.age { font-size: 12px; }
.age.old { color: var(--warn); }

/* Variant B: tug of war */
.tug { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tugcol { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 6px; min-width: 0; }
.tugcol h2 { margin: 0; padding: 8px 10px; font-size: 13px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-subtle); }
.tugrow { display: grid; grid-template-columns: 64px 1fr 62px 76px 92px; gap: 8px; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; }
.tugrow:hover { background: var(--bg-selected); }
.tugrow.stale { opacity: .5; }
.tugbar { height: 14px; background: var(--bg-canvas); border-radius: 2px; position: relative; overflow: hidden; }
.tugbar i { position: absolute; top: 0; bottom: 0; }
.tugcol.offer .tugbar i { right: 0; }
.mini { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; padding: 6px 0 4px; font-size: 12px; }
.mini .lv { display: grid; grid-template-columns: 1fr 60px 34px; gap: 6px; position: relative; padding: 1px 4px; }
.mini .lv b { position: absolute; inset: 0 auto 0 0; z-index: 0; border-radius: 2px; }
.mini .lv span { position: relative; z-index: 1; }
.tugmid { display: flex; justify-content: center; gap: 18px; font-size: 12px; color: var(--text-muted); grid-column: 1 / -1; }

/* Variant C: tiles + event feed */
.tilesgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 10px; align-items: start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.tile { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 7px 8px; cursor: pointer; display: grid; gap: 4px; position: relative; }
.tile:hover { border-color: var(--border-strong); }
.tile.stale { opacity: .45; }
.tile.ping { box-shadow: 0 0 0 1px var(--accent), 0 0 14px color-mix(in oklab, var(--accent) 35%, transparent); }
.tile .row1 { display: flex; justify-content: space-between; align-items: baseline; }
.tile .fly { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; height: 30px; }
.fly .side { display: flex; flex-direction: column; gap: 1px; }
.fly .bid { align-items: flex-end; } .fly .offer { align-items: flex-start; }
.fly i { display: block; height: 5px; border-radius: 1px; }
.tile .row3 { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
.tile .lastev { min-height: 16px; }
.feed { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 6px; max-height: 74vh; overflow: auto; position: sticky; top: 8px; }
.feed h2 { margin: 0; padding: 8px 10px; font-size: 13px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; position: sticky; top: 0; background: var(--bg-surface); }
.feeditem { padding: 6px 10px; border-bottom: 1px solid var(--border-subtle); display: grid; grid-template-columns: 58px 48px 1fr; gap: 6px; font-size: 12px; cursor: pointer; }
.feeditem:hover { background: var(--bg-selected); }
.feeditem .d { grid-column: 3; color: var(--text-secondary); }
.feeditem.new { animation: flash 1.4s ease-out; }

/* D and E: split + feed */
.splitfeed { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 10px; align-items: start; }
.halves { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-width: 0; }
.half { min-width: 0; display: grid; gap: 6px; align-content: start; }
.half h2 { margin: 0; font-size: 13px; display: flex; justify-content: space-between; padding: 2px 2px 4px; }
.half .tiles { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
@media (max-width: 1100px) { .splitfeed { grid-template-columns: 1fr; } .feed { position: static; max-height: 50vh; } }
@media (max-width: 640px) { .halves { grid-template-columns: 1fr; } }
/* Drawer, toasts, switcher */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--bg-sidebar); border-left: 1px solid var(--border-strong); box-shadow: 0 16px 48px rgba(4,10,18,.6); padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px 16px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); overflow: auto; z-index: 30; transform: translateX(100%); transition: transform .2s; }
.drawer.open { transform: none; }
.drawer h2 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; }
.drawer .hist { display: grid; gap: 0; }
.drawer .hist div { padding: 6px 0; border-bottom: 1px solid var(--border-subtle); font-size: 12px; }
.rule { border: 1px solid var(--border-subtle); border-radius: 6px; padding: 8px; display: grid; gap: 6px; margin-bottom: 8px; background: var(--bg-surface); font-size: 12px; }
.rule .kinds { display: flex; flex-wrap: wrap; gap: 4px; }
.rule .kinds label { display: inline-flex; gap: 4px; align-items: center; padding: 2px 6px; border: 1px solid var(--border-strong); border-radius: 4px; }
/* Sonner stack (bottom-right), cards shaped like the app's KToast. */
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100% - 32px)); height: 0; z-index: 25; }
.toast { position: absolute; right: 0; bottom: 0; width: 100%; display: flex; align-items: flex-start; gap: 12px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 12px 16px; box-shadow: 0 4px 16px rgba(4,10,18,.45); transition: transform .35s cubic-bezier(.21,1.02,.73,1), opacity .35s; transform-origin: bottom center; }
.toast .ti { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.toast .tb { min-width: 0; flex: 1; }
.toast .tt { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-primary); }
.toast .td { font-size: 12px; line-height: 18px; color: var(--text-secondary); margin-top: 2px; }
.toast .ta { background: transparent; border: 0; border-radius: 5px; padding: 3px 8px; color: var(--text-primary); font-size: 12px; font-weight: 600; }
.toast .ta:hover { background: var(--bg-selected); }
.toast .tx { background: transparent; border: 0; border-radius: 5px; width: 24px; height: 24px; margin: -4px -6px 0 0; color: var(--text-muted); }
.toast .tx:hover { background: var(--bg-selected); color: var(--text-primary); }
.switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 6px; background: var(--proto); color: #120b2a; border-radius: 999px; padding: 5px 6px; box-shadow: 0 6px 24px rgba(0,0,0,.5); z-index: 40; font-weight: 700; font-size: 12px; }
.switcher button { background: #120b2a; color: var(--proto); border: 0; border-radius: 999px; width: 28px; height: 28px; }
.switcher span { padding: 0 8px; white-space: nowrap; }
.hint { font-size: 12px; color: var(--text-muted); }
@media (max-width: 760px) {
  .tug { grid-template-columns: 1fr; }
  .tilesgrid { grid-template-columns: 1fr; }
  .feed { position: static; max-height: 50vh; }
  .tugrow { grid-template-columns: 56px 1fr 56px 46px; }
  .tugrow .nd { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <div class="proto-strip"><b>Prototype</b> · simulated books and events, not market data · variant <span id="vname"></span></div>
  <header class="top">
    <h1>Order book radar</h1>
    <span class="chip" id="phase"><span class="dot"></span><span id="clock">Session 2 · 14:12:03</span></span>
    <span class="chip" id="feedchip"><span class="dot"></span><span id="feedtxt">Stockbit live</span></span>
    <span class="spacer"></span>
    <button class="iconbtn" id="simStale" title="Simulate Stockbit going stale">Simulate stale feed</button>
    <button class="iconbtn" id="rulesBtn">Alert rules</button>
    <button class="iconbtn" id="bellBtn" aria-label="Alert history">Alerts <span class="badge" id="bellCount" hidden>0</span></button>
  </header>
  <div class="banner" id="banner">Stockbit is stale. Only codes with an Ajaib book (your selected and watchlist codes) are live; the rest show their last book until Stockbit is back.</div>
  <div class="toolbar">
    <label for="floor">Value floor
      <select id="floor"><option value="1e8">Rp100 M</option><option value="1e9" selected>Rp1 B</option><option value="1e10">Rp10 B</option><option value="5e10">Rp50 B</option></select>
    </label>
    <div class="seg" role="group" aria-label="Codes"><button id="fAll" aria-pressed="true">All above floor</button><button id="fWatch" aria-pressed="false">Watchlist</button></div>
    <label for="search">Search <input type="text" id="search" placeholder="BBCA" maxlength="6"></label>
    <label for="pmin">Price <input type="number" id="pmin" placeholder="min" min="1"> – <input type="number" id="pmax" placeholder="max" min="1" aria-label="Maximum price"></label>
    <span class="spacer"></span>
    <span class="sortnote" id="sortnote"></span>
  </div>
  <div class="excluded" id="excluded"></div>
  <main id="view"></main>
</div>

<div class="toasts" id="toasts"></div>
<aside class="drawer" id="drawer" aria-label="Panel"></aside>
<div class="switcher" role="group" aria-label="Prototype variant">
  <button id="prev" aria-label="Previous variant">◀</button><span id="vlabel"></span><button id="next" aria-label="Next variant">▶</button>
</div>

<script>
// ---------- simulation ----------
const REAL = "BBCA BBRI BMRI BBNI TLKM ASII GOTO ANTM ADRO PTBA UNVR ICBP INDF KLBF CPIN SMGR INTP EXCL ISAT MDKA AMRT ACES ERAA MAPI BRPT TPIA PGAS MEDC ITMG INCO TINS BUKA EMTK ARTO BRIS BTPS MNCN SCMA AKRA UNTR HRUM INKP TKIM JSMR WIKA PTPP ADHI BSDE CTRA PWON SMRA LPKR MYOR SIDO HMSP GGRM CPRO JPFA AALI LSIP SSMS DSNG TAPG BREN CUAN PGEO AMMN MBMA NCKL DOID ELSA ENRG BUMI BRMS DEWA PSAB ESSA AVIA MTEL TOWR TBIG BBTN BJBR BJTM BNGA PNBN NISP BDMN AGRO BBYB BBHI ARCI RAJA RATU HEAL MIKA SILO TRIN COIN INET FOLK DFAM UNIQ KOTA WIFI PANI ASRI DILD MPPA RALS LPPF HRTA PNLF SMDR TMAS NELY BIRD ASSA GJTL AUTO SMSM IMAS DRMA MARK".split(" ");
const WATCH = new Set(["BBCA","BBRI","TLKM","GOTO","ANTM","BREN","ADRO","MDKA","BRMS","CUAN"]);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const tickOf = p => p < 200 ? 1 : p < 500 ? 2 : p < 2000 ? 5 : p < 5000 ? 10 : 25;
const snap = p => Math.max(tickOf(p), Math.round(p / tickOf(p)) * tickOf(p));
const L = "ABCDEFGHIJKLMNOPRSTUW";
const codes = [...REAL];
while (codes.length < 380) { const c = Array.from({length: 4}, () => L[Math.floor(rnd() * L.length)]).join(""); if (!codes.includes(c)) codes.push(c); }
let simNow = Date.parse("2026-11-18T14:12:03+07:00"); const simStart = simNow;
const stocks = codes.map((code, i) => {
  const r = rnd();
  const price = i % 47 === 30 ? 5 + Math.floor(rnd() * 6) : snap(i < 12 ? 2000 + rnd() * 8000 : r < .35 ? 50 + rnd() * 150 : r < .65 ? 200 + rnd() * 800 : r < .9 ? 1000 + rnd() * 3000 : 5000 + rnd() * 15000);
  const busy = i < 40 ? 1 + rnd() * 2.2 : Math.pow(rnd(), 3) * 0.6 + 0.01;
  return { code, price, busy, value: (i < 60 ? 2e10 + rnd() * 6e11 : Math.pow(rnd(), 2.2) * 4e10) * (0.6 + rnd()),
    bias: (rnd() - .5) * 1.2, bids: [], offers: [], at: simNow - rnd() * 95000, events: [], limit: null, flash: 0 };
});
// A handful at a limit, a few stale.
stocks[17].limit = "upper"; stocks[121].limit = "lower";
function buildBook(s) {
  const t = tickOf(s.price), base = 40 + s.busy * 900;
  const gap = s.busy > 1 ? 0 : rnd() < .5 ? 0 : 1 + Math.floor(rnd() * 3);
  const mk = (dir) => { const out = []; let p = dir > 0 ? s.price + t * (1 + (rnd() < .5 ? gap : 0)) : s.price - t * (rnd() < .5 ? gap : 0);
    for (let k = 0; k < 20; k++) { const skip = rnd() < (s.busy > 1 ? .06 : .3) ? (rnd() < .5 ? 1 : 2) : 0; p += dir * t * (k ? 1 + skip : 0);
      if (p <= 0) break; let lots = Math.round(base * (0.3 + rnd() * 1.6) * (1 + (dir < 0 ? s.bias : -s.bias) * .8) * (k < 5 ? 1 : 1.3));
      if (rnd() < .025) lots *= 8 + Math.floor(rnd() * 6);
      out.push({ price: p, lots: Math.max(1, lots), orders: Math.max(1, Math.round(lots / (8 + rnd() * 120))) }); }
    return out; };
  s.bids = s.limit === "lower" ? [] : mk(-1);
  s.offers = s.limit === "upper" ? [] : mk(1);
}
stocks.forEach(buildBook);
function readings(s) {
  const top = (side) => side.slice(0, 5);
  const bl = top(s.bids).reduce((a, l) => a + l.lots, 0), ol = top(s.offers).reduce((a, l) => a + l.lots, 0);
  const imb = bl + ol === 0 ? 0 : (bl - ol) / (bl + ol) * 100;
  const depth = side => top(side).reduce((a, l) => a + l.lots * l.price * 100, 0);
  const empty = side => { let e = 0, widest = 0; const lv = top(side);
    for (let k = 1; k < lv.length; k++) { const g = Math.round(Math.abs(lv[k].price - lv[k - 1].price) / tickOf(Math.min(lv[k].price, lv[k-1].price))) - 1; e += g; widest = Math.max(widest, g); } return { e, widest }; };
  const lpo = side => { const lv = top(side); const o = lv.reduce((a, l) => a + l.orders, 0); return o ? lv.reduce((a, l) => a + l.lots, 0) / o : 0; };
  const bb = s.bids[0]?.price, bo = s.offers[0]?.price;
  let spreadT = null, spreadP = null;
  if (bb && bo) { spreadT = 0; for (let p = bb; p < bo; p += tickOf(p)) spreadT++; spreadP = (bo - bb) / ((bo + bb) / 2) * 100; }
  return { imb, bDepth: depth(s.bids), oDepth: depth(s.offers), bEmpty: empty(s.bids), oEmpty: empty(s.offers), bLpo: lpo(s.bids), oLpo: lpo(s.offers), spreadT, spreadP };
}
const KINDS = [["Absorbed", 3], ["Eaten", 2], ["Reloaded", 2.5], ["Wall appeared", 2], ["Wall pulled", 1.5], ["Wall moved", .6]];
const kindTotal = KINDS.reduce((a, k) => a + k[1], 0);
function makeEvent(s) {
  let r = rnd() * kindTotal, kind = KINDS[0][0]; for (const [k, w] of KINDS) { if ((r -= w) < 0) { kind = k; break; } }
  const side = rnd() < .5 ? "bid" : "offer"; const lv = (side === "bid" ? s.bids : s.offers); if (!lv.length) return null;
  const idx = kind.startsWith("Wall") ? Math.floor(rnd() * Math.min(lv.length, 12)) : Math.floor(rnd() * Math.min(3, lv.length));
  const level = lv[idx]; const lots = Math.round(level.lots * (kind.startsWith("Wall") ? 6 + rnd() * 6 : 1 + rnd() * 3)); const orders = kind.startsWith("Wall") ? 1 + Math.floor(rnd() * 5) : 3 + Math.floor(rnd() * 40);
  let detail;
  switch (kind) {
    case "Absorbed": detail = `${fmtLots(lots)} lots traded into ${fmtP(level.price)}, ${fmtLots(level.lots)} still shown`; break;

  const row = e.target.closest("[data-c]"); if (!row) return;
  if ((VARIANTS[vi][0] === "tug" || VARIANTS[vi][0] === "tug-feed") && !row.dataset.feed) { expanded = expanded === row.dataset.c ? null : row.dataset.c; render(); }
  else openMarketLive(row.dataset.c);
});
viewEl.addEventListener("pointerenter", () => { hovering = true; });
viewEl.addEventListener("pointerleave", () => { hovering = false; });
document.getElementById("prev").onclick = () => setVariant(vi - 1);
document.getElementById("next").onclick = () => setVariant(vi + 1);
addEventListener("keydown", e => { if (e.target.closest("input,textarea,select,[contenteditable]")) return; if (e.key === "ArrowLeft") setVariant(vi - 1); if (e.key === "ArrowRight") setVariant(vi + 1); });
["floor", "search", "pmin", "pmax"].forEach(id => document.getElementById(id).addEventListener("input", () => { resort(true); render(); }));
document.getElementById("fAll").onclick = () => { watchOnly = false; document.getElementById("fAll").setAttribute("aria-pressed", "true"); document.getElementById("fWatch").setAttribute("aria-pressed", "false"); resort(true); render(); };
document.getElementById("fWatch").onclick = () => { watchOnly = true; document.getElementById("fWatch").setAttribute("aria-pressed", "true"); document.getElementById("fAll").setAttribute("aria-pressed", "false"); resort(true); render(); };
document.getElementById("simStale").onclick = () => { stockbitStale = !stockbitStale; document.getElementById("banner").classList.toggle("on", stockbitStale); document.getElementById("feedchip").classList.toggle("stale", stockbitStale); document.getElementById("feedtxt").textContent = stockbitStale ? "Stockbit stale · Ajaib for watchlist" : "Stockbit live"; document.getElementById("simStale").textContent = stockbitStale ? "Restore feed" : "Simulate stale feed"; };
document.getElementById("bellBtn").onclick = () => drawerMode === "history" ? closeDrawer() : openHistory();
document.getElementById("rulesBtn").onclick = () => drawerMode === "rules" ? closeDrawer() : openRules();
// Warm up so the first frame has events and ages.
for (let i = 0; i < 240; i++) { simNow += 250; for (const s of stocks) if (rnd() < s.busy * .1) { buildBook(s); s.at = simNow; if (rnd() < .03 * Math.min(1, s.busy) && s.price > 10) { const e = makeEvent(s); if (e) { s.events.push(e); feed.unshift(e); } } } }
feed.length = Math.min(feed.length, 120);
resort(true); render();
setInterval(tick, 250);
