name: Install dependencies
description: Restore the workspace's node_modules by the lockfile, or install them with pnpm and save them.

# Decision: CI restores the whole node_modules tree, the root's and every
# workspace's, keyed by what pnpm installs from, and skips `pnpm install` on a
# hit (apinrdw/kumora#190). Each job used to restore the pnpm store
# (setup-node's `cache: pnpm`) and then link it, about 27 s, on every run. The
# key holds this file too, so a change to the paths below starts a fresh
# entry. It also holds the Node major the jobs' setup-node resolves and the
# pnpm version that `packageManager` pins, so a Node or pnpm bump with no
# lockfile change installs afresh: native addons are built per Node major,
# and pnpm's layout can change between its versions. Workers Builds is
# unaffected: it clones the repo and runs its own
# `pnpm install --frozen-lockfile` before the deploy command, and bun reads
# the same node_modules in both places. In CI a hit takes 7-10 s against a
# miss's 25-28 s (run 43091968909, attempts 2 and 1).
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        echo "node=$(node -p 'process.versions.node.split(".")[0]')" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(pnpm --version)" >> "$GITHUB_OUTPUT"
    # The same three paths as the node_modules save step at the end.
    - id: modules
      uses: actions/cache/restore@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.versions.outputs.node }}-pnpm${{ steps.versions.outputs.pnpm }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/actions/install/action.yml') }}
    # Decision: only a miss restores the pnpm store, the last one saved for
    # this runner, so pnpm downloads just what the lockfile added. Each store
    # and node_modules entry is saved as soon as the install ends, before a
    # later step can write into node_modules (vite's optimizer output lives
    # in apps/*/node_modules/.vite and has a cache of its own in e2e).
    - id: store-path
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - id: store
      if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.store-path.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: steps.modules.outputs.cache-hit != 'true' && steps.store.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.store-path.outputs.path }}
        key: ${{ steps.store.outputs.cache-primary-key }}
    # The same three paths as the node_modules restore step at the top.
    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
