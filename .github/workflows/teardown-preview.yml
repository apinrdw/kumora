# Destroys a branch's preview stage of every app when its PR closes or the
# branch is deleted, and runs the daily Preview sweep, which destroys every
# Stale Preview. Workers Builds deploys; this workflow only tears down.
name: Tear down preview

on:
  pull_request:
    types: [closed]
  delete:
  schedule:
    - cron: "0 20 * * *" # 03:00 WIB
  workflow_dispatch:
    inputs:
      dry-run:
        description: List the Stale Previews and destroy nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  stage:
    # A PR from a release branch, such as a Sync (main into staging), has no
    # Preview: its head deploys a release stage.
    if: (github.event_name == 'pull_request' && !contains(fromJSON('["main", "staging"]'), github.head_ref)) || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
      # Decision: vp is the CLI; pnpm resolves underneath; turbo still runs the tasks
      # (docs/adr/0021-vp-is-the-cli-pnpm-resolves-underneath-turbo-still-runs-the-tasks.md)
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.8.0
          node-version: 24
          cache: true
          run-install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: vp install --frozen-lockfile
      # Refuses production and staging, so this job can never reach them.
      - id: stage
        run: bun packages/deploy/src/teardown.ts stage "$BRANCH" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.event.ref }}

  destroy:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A merged PR fires both triggers; the second destroy waits, then finds nothing.
    concurrency:
      group: preview-${{ needs.stage.outputs.stage }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.8.0
          node-version: 24
          cache: true
          run-install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: vp install --frozen-lockfile
      # Decision: teardown logs into Infisical by OIDC, as a Viewer that sees prod
      # (docs/adr/0009-teardown-reads-infisical-by-github-oidc-as-a-viewer.md)
      - run: bun packages/deploy/src/teardown.ts destroy "$STAGE"
        env:
          STAGE: ${{ needs.stage.outputs.stage }}
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_TEARDOWN_IDENTITY_ID }}

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Under the teardown identity's 1800s Infisical token TTL
    # (docs/runbooks/deploy.md §5), so no destroy outlives its token. A
    # sweep cut short leaves its rest to the next day's run.
    timeout-minutes: 25
    # One sweep at a time. Its destroys don't share the event-driven destroy's
    # preview-<stage> group, which would take a job per Stale Preview: an
    # overlap with that destroy is harmless, because whichever runs second
    # finds the stage gone, as a merged PR's second trigger already does.
    concurrency:
      group: preview-sweep
    permissions:
      contents: read
      # The stale rule reads each branch's PRs.
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.8.0
          node-version: 24
          cache: true
          run-install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: vp install --frozen-lockfile
      # Decision: teardown logs into Infisical by OIDC, as a Viewer that sees prod
      # (docs/adr/0009-teardown-reads-infisical-by-github-oidc-as-a-viewer.md)
      #
      # A scheduled run has no inputs, so it destroys for real.
      - run: bun packages/deploy/src/teardown.ts sweep $DRY_RUN
        env:
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_TEARDOWN_IDENTITY_ID }}
