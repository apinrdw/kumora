# Where a run's time went, per job and step: pnpm ci-timings <run-id>. The
# e2e-evidence gate runs in its own workflow, e2e-evidence.yml, so a PR's gate
# job has a run id of its own.
name: CI

on:
  push:
    branches: [main, staging]
  # Decision: drafts run no CI; marking a PR ready runs it on the current head.
  # A job skipped by its `if` reports skipped, which a required check accepts,
  # and a draft can't merge anyway.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The static checks and the unit tests each get a runner's 2 cores; each
  # job runs one root check:* script, and `pnpm check` runs them all.
  static:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Decision: full history, for check-extension-version.mts's
          # merge-base with the PR's base branch. It costs about a second of
          # checkout (5 s for fallow's full clone, 4 s shallow, run 43219223062).
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Decision: turbo replays tasks from the GitHub Actions cache. It needs
      # no secret, and GitHub scopes entries by ref, so a PR reads main's and
      # its own while main never replays a PR's. Pinned to a commit because it
      # holds the runner's cache token (v2.5.2); unit-tests pins the same commit.
      - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e
      - run: pnpm check:static

  unit-tests:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # packages/deploy's run test runs its entry point under bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      # The same turbo cache as static's, pinned to the same commit.
      - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e
      # Decision: one package's tests at a time on CI's 2 cores. A shared
      # package's change misses the cache for every dependent, and their suites
      # run together ran 4-5x slower than locally, timing out tests near their
      # limits. Serial costs little, as dashboard's suite dominates; locally
      # turbo keeps its default. See apinrdw/kumora#527.
      - run: pnpm check:test --concurrency=1

  fallow:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The audit diffs against the base ref, so it needs the full history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: fallow-rs/fallow@v3
        with:
          command: audit
