name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The static checks and the unit tests each get a runner's 2 cores; each
  # job runs one root check:* script, and `pnpm check` runs them all.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/install
      # Decision: turbo replays tasks from the GitHub Actions cache. It needs
      # no secret, and GitHub scopes entries by ref, so a PR reads main's and
      # its own while main never replays a PR's. Pinned to a commit because it
      # holds the runner's cache token (v2.5.2); unit-tests pins the same commit.
      - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e
      - run: pnpm check:static

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # packages/deploy's run test runs its entry point under bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: ./.github/actions/install
      # The same turbo cache as static's, pinned to the same commit.
      - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e
      - run: pnpm check:test

  fallow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The audit diffs against the base ref, so it needs the full history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/install
      - uses: fallow-rs/fallow@v3
        with:
          command: audit

  # Decision: e2e runs as shards that each start their own servers and
  # storage, rerun the setup project, and log their own failures with the
  # list reporter, with no merged report (apinrdw/kumora#168). A failing shard
  # stops no other.
  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Decision: each spec project is sharded on its own, 3 chromium and 5
      # trading-day, not one list cut into 6 (apinrdw/kumora#190). Playwright
      # cuts a list into contiguous shards by test count, so with one list
      # the trading-day tests, which run one at a time, filled whole shards
      # and left their second worker idle. trading-day's recorded spec waits
      # for a real market-clock minute, so the shard that holds it is the
      # slowest of the five. With 2 chromium shards, CI's warm run
      # (43091968909, attempt 2) finished chromium at 2:49 and 2:44 and
      # trading-day 1/5 at 2:50, while trading-day 2/5 to 5/5 finished at
      # 2:03-2:25, so chromium sat on the critical path. At 3 chromium shards
      # they finish at PLACEHOLDER and trading-day 1/5 at PLACEHOLDER
      # (run PLACEHOLDER). Tune a project's count by its list, against the
      # CI job times: its shards run 1/n to n/n, and workflow-deps checks
      # they are whole.
      matrix:
        include:
          - { project: chromium, shard: 1/3 }
          - { project: chromium, shard: 2/3 }
          - { project: chromium, shard: 3/3 }
          - { project: trading-day, shard: 1/5 }
          - { project: trading-day, shard: 2/5 }
          - { project: trading-day, shard: 3/5 }
          - { project: trading-day, shard: 4/5 }
          - { project: trading-day, shard: 5/5 }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: ./.github/actions/install
      - id: playwright
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Decision: the browser is cached by the Playwright version the lockfile
      # pins, and installed only on a miss. No --with-deps: the runner image
      # already has its system packages.
      - id: browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install chromium
      # Decision: both apps' vite optimizer output is cached between runs, so
      # the dev servers start without the cold dependency prebundle; this
      # reverses spec #175's "leave the cold compile alone"
      # (apinrdw/kumora#190). Vite checks the restored output against the
      # lockfile and its config and rebundles on a mismatch, so a stale entry
      # costs only that rebundle. The key adds the app and package sources, so
      # a change that imports a new dependency saves a fresh entry, and
      # restore-keys hands any other change the last entry for the same
      # lockfile and configs. In CI a warm cache skips the optimizer and starts
      # the dashboard in 12.6-14.6 s against a miss's 13.4-16.2 s, for a 1 s
      # restore (run 43091968909, attempts 2 and 1): a small gain, since the
      # first sign-up's slow compile is the app's own code, not its deps.
      - uses: actions/cache@v6
        with:
          path: |
            apps/web/node_modules/.vite
            apps/dashboard/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/vite.config.ts', 'apps/dashboard/vite.config.ts') }}-${{ hashFiles('apps/web/src/**', 'apps/dashboard/src/**', 'packages/*/src/**') }}
          restore-keys: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/web/vite.config.ts', 'apps/dashboard/vite.config.ts') }}-
      - run: pnpm test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}
