# Where a run's time went, per job and step: vp run ci-timings <run-id>. The
# e2e-evidence gate runs in its own workflow, e2e-evidence.yml, so a PR's gate
# job has a run id of its own.
name: CI

on:
  push:
    branches: [main, staging]
  # Decision: a draft PR runs no CI and gets no status until ready for review
  # (docs/adr/0004-drafts-run-no-checks.md)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The static checks and the unit tests each get a runner's 2 cores; each
  # job runs one root check:* script, and `vp run check` runs them all.
  static:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, for check-extension-version.mts's
          # merge-base with the PR's base branch. It costs about a second of
          # checkout (5 s for fallow's full clone, 4 s shallow, run 43219223062).
          fetch-depth: 0
      # Decision: vp is the CLI; pnpm resolves underneath; turbo still runs the tasks
      # (docs/adr/0021-vp-is-the-cli-pnpm-resolves-underneath-turbo-still-runs-the-tasks.md)
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.8.0
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # Decision: turbo replays tasks from the GitHub Actions cache, pinned by commit
      # (docs/adr/0005-turbo-replays-tasks-from-the-github-actions-cache.md)
      - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e
      - run: vp run check:static

  unit-tests:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.8.0
          node-version: 24
          cache: true
          run-install: false
      # packages/deploy's run test runs its entry point under bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: vp install --frozen-lockfile
      # The same turbo cache as static's, pinned to the same commit.
      - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e
      # One package's tests at a time on CI's 2 cores. A shared
      # package's change misses the cache for every dependent, and their suites
      # run together ran 4-5x slower than locally, timing out tests near their
      # limits. Serial costs little, as dashboard's suite dominates; locally
      # turbo keeps its default. See apinrdw/kumora#527.
      - run: vp run check:test --concurrency=1

  fallow:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The audit diffs against the base ref, so it needs the full history.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.8.0
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - uses: fallow-rs/fallow@v3
        with:
          command: audit
