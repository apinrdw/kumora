# Release tags (scripts/release-tag.mts). The owner pushes a Release tag,
# v<version>-<YYYYMMDD>, on a staging commit whose Release version it names;
# this run deletes one it refuses. Publishing a GitHub Release on that tag
# fast-forwards main to its commit, and Workers Builds deploys main to
# Production.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

concurrency:
  group: release

permissions:
  contents: write
  statuses: write

jobs:
  release:
    # A draft or a pre-release releases nothing.
    if: github.event_name == 'push' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Decision: vp is the CLI; pnpm resolves underneath; turbo still runs the tasks
      # (docs/adr/0021-vp-is-the-cli-pnpm-resolves-underneath-turbo-still-runs-the-tasks.md)
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: 1.8.0
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      # Decision: a Release tag names the Release version on a staging commit
      # (docs/adr/0020-a-release-tag-names-the-release-version-on-a-staging-commit.md)
      - run: node scripts/judge-release-tag.mts "$TAG" "$GITHUB_EVENT_NAME"
      - run: |
          sha="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/staging; then
            echo "::error::$TAG ($sha) is not on staging."
            exit 1
          fi
      # Decision: publishing a Release fast-forwards main; no PR reaches Production
      # (docs/adr/0007-production-is-reached-by-a-release-that-fast-forwards-main.md)
      - if: github.event_name == 'release'
        run: |
          sha="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor origin/main "$sha"; then
            echo "::error::main has commits $TAG lacks. Merge the open Sync PR into staging, bump the Release version, then push a new Release tag."
            exit 1
          fi
          # The release branches' ruleset requires e2e-evidence on main's new
          # head, and every commit this moves passed it on its own PR.
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state=success -f context=e2e-evidence \
            -f description="released as $TAG; its PRs passed this gate"
          git push origin "$sha:refs/heads/main"
      # A refused push deletes its tag. A refused Release deletes the Release
      # and keeps its tag, which deploys nothing.
      - if: failure()
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            gh release delete "$TAG" --yes
          else
            git push origin ":refs/tags/$TAG"
          fi
