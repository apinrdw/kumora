# Release tags (scripts/release-tag.mts). Pushing a Candidate tag,
# v<version>-<YYYYMMDD>-<N>, marks a staging commit tried on Staging.
# Publishing a GitHub Release on a Production tag, v<version>-<YYYYMMDD>,
# fast-forwards main to its Candidate's commit, and Workers Builds deploys
# main to Production.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

concurrency:
  group: release

permissions:
  contents: write
  statuses: write

jobs:
  release:
    # A pre-release is a note on a Candidate, never a release.
    if: github.event_name == 'push' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: tag
        run: node scripts/judge-release-tag.mts "$TAG" >> "$GITHUB_OUTPUT"
      - env:
          KIND: ${{ steps.tag.outputs.kind }}
        run: |
          case "$GITHUB_EVENT_NAME:$KIND" in
            push:candidate | release:production) ;;
            release:candidate)
              echo "::error::A Release is published on a Production tag, v<version>-<YYYYMMDD>; $TAG is a Candidate."
              exit 1
              ;;
            # Decision: publishing a Release, not pushing a tag, is what
            # releases. Publishing creates the tag too; that push passes here
            # and the release run moves main.
            push:production)
              published="$(gh release view "$TAG" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not' 2>/dev/null || true)"
              if [ "$published" != "true" ]; then
                echo "::error::Publish a GitHub Release for $TAG instead of pushing the tag alone."
                exit 1
              fi
              ;;
          esac
          sha="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/staging; then
            echo "::error::$TAG ($sha) is not on staging."
            exit 1
          fi
      - if: github.event_name == 'release'
        run: |
          sha="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor origin/main "$sha"; then
            echo "::error::main has commits $TAG lacks. Merge the open Sync PR into staging, then tag a new Candidate."
            exit 1
          fi
          # The release branches' ruleset requires e2e-evidence on main's new
          # head, and every commit this moves passed it on its own PR.
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state=success -f context=e2e-evidence \
            -f description="released as $TAG; its PRs passed this gate"
          git push origin "$sha:refs/heads/main"
      # Decision: a refused Release or tag is deleted, so it never counts
      # toward the next Candidate's N or the version Production must exceed.
      # A Release refused on a Candidate keeps that Candidate's tag.
      - if: failure()
        env:
          KIND: ${{ steps.tag.outputs.kind }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            gh release delete "$TAG" --yes
          fi
          if [ "$KIND" != candidate ] || [ "$GITHUB_EVENT_NAME" = push ]; then
            git push origin ":refs/tags/$TAG"
          fi
