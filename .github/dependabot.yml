version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Decision: oxlint and oxfmt are pinned exactly and move by one grouped PR
    # (docs/adr/0003-oxlint-and-oxfmt-are-pinned-and-move-by-one-grouped-pr.md)
    allow:
      - dependency-name: "oxlint"
      - dependency-name: "oxfmt"
    groups:
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
