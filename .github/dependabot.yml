version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Decision: vite-plus is the one Oxc pin; every lint and format call goes through vp
    # (docs/adr/0022-vite-plus-is-the-one-oxc-pin.md)
    allow:
      - dependency-name: "vite-plus"
    groups:
      oxc:
        patterns:
          - "vite-plus"
