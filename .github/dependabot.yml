version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Decision: oxlint and oxfmt are pinned to exact versions in package.json
    # and move only through this grouped PR. Oxlint minors add rules and change
    # defaults without calling it breaking, so a range fails CI unannounced.
    # `allow` limits version updates to these two packages; no other dependency gets PRs.
    allow:
      - dependency-name: "oxlint"
      - dependency-name: "oxfmt"
    groups:
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
