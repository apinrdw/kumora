packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  lightningcss: true
  unrs-resolver: true
  workerd: true
  msw: false

minimumReleaseAgeExclude:
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"

# Decision: the Effect and Alchemy pins live once, in the catalog
# (docs/adr/0015-effect-and-alchemy-pins-live-once-in-the-catalog.md)
catalog:
  effect: &effect 4.1.2
  "@effect/platform-bun": *effect
  "@effect/platform-node": *effect
  "@effect/vitest": *effect
  alchemy: &alchemy 2.0.0-beta.85
  "@alchemy.run/cloudflare": *alchemy
  "@alchemy.run/cloudflare-runtime": *alchemy
  "@alchemy.run/frontend-frameworks": *alchemy
  "@alchemy.run/infisical": *alchemy
